model:
  name: mobilenet_v2
  experiment_id: E02
  torchvision_weights: IMAGENET1K_V2
  output_dim: 1
  score_type: logit
  loss: BCEWithLogitsLoss
  negative_label: 0
  positive_label: 1
  higher_score_label: 1
  dropout: 0.2

initial_training_policy:
  freeze_backbone: true
  train_classifier: true
  later_unfreeze: supported

preprocessing:
  input_channels: 3
  resize_size: [224, 224]
  crop_size: null
  resize_policy: direct_square
  interpolation: bilinear
  antialias: true
  pixel_range_before_normalization: [0.0, 1.0]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

checkpoint:
  format: state_dict
  format_version: 1
  restore_without_weights_download: true
